name: Prototype local
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.8'
          enable-cache: false
      - name: Python reproductible, y compris Windows
        run: uv python install 3.11.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25.2.0'
      - name: Publication sans captures ni secrets usuels
        run: uv run --no-project --python 3.11.14 python -m scripts.check_repository
      - name: Calculs, API et séances synthétiques
        run: uv run --no-project --python 3.11.14 python -m unittest discover -s tests -v
      - name: Capture et contrôleur navigateur simulé
        run: node --test tests/test_capture_core.cjs tests/test_web_lifecycle.cjs tests/test_guide.cjs
