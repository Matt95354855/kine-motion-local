name: Prototype local
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.8'
          enable-cache: false
      - name: Python reproductible, y compris Windows
        run: uv python install 3.11.14
      - uses: actions/setup-node@v4
        with:
          node-version: '25.2.0'
      - name: Publication sans captures ni secrets usuels
        run: uv run --no-project --python 3.11.14 python -m scripts.check_repository
      - name: Calculs, API et séances synthétiques
        run: uv run --no-project --python 3.11.14 python -m unittest discover -s tests -v
      - name: Capture et contrôleur navigateur simulé
        run: node --test tests/test_capture_core.cjs tests/test_web_lifecycle.cjs
